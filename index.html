<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For San ❤️</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           1. PREMIUM COLOR PALETTE & VARIABLES
           ========================================== */
        :root {
            --bg-warm-ivory: #FAF6F0;
            --bg-paper: rgba(255, 253, 250, 0.75);
            --bg-paper-solid: #FCFAF7;
            --baby-pink: #FCEEEF;
            --blush-pink: #F5D3D6;
            --champagne-gold: #D4AF37;
            --champagne-gold-light: #F7E7B4;
            --champagne-gold-border: rgba(212, 175, 55, 0.3);
            --champagne-gold-glow: rgba(212, 175, 55, 0.18);
            --text-dark: #221F1D;
            --text-muted: #7E7063;
            --rose-muted: #B36B69;
            --rose-accent: #C87B78;
            
            /* High-end Shadows */
            --shadow-soft: 0 12px 35px rgba(179, 107, 105, 0.07);
            --shadow-card: 0 20px 40px rgba(34, 31, 29, 0.05);
            --shadow-glow: 0 0 30px rgba(212, 175, 55, 0.35);
            --shadow-glass: 0 8px 32px 0 rgba(179, 107, 105, 0.08);
            
            --radius-sm: 14px;
            --radius-md: 24px;
            --radius-lg: 36px;
            
            --font-display: 'Playfair Display', Georgia, serif;
            --font-heading: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition-lux: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-warm-ivory);
            color: var(--text-dark);
            font-family: var(--font-body);
            font-weight: 300;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        body {
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Typography */
        h1, h2, h3, .serif-font {
            font-family: var(--font-heading);
            font-weight: 600;
            line-height: 1.2;
            color: var(--text-dark);
            letter-spacing: -0.01em;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #221F1D 0%, #B8860B 50%, #221F1D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-top: 10px;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .section-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--rose-muted);
            margin-bottom: 14px;
            display: block;
            font-weight: 500;
        }

        /* Layout */
        section {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 24px;
            position: relative;
            z-index: 2;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        .container-wide {
            max-width: 1040px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        /* Premium Buttons */
        .btn {
            background: linear-gradient(135deg, #FFFFFF 0%, #FCFAF7 100%);
            border: 1px solid var(--champagne-gold-border);
            color: var(--text-dark);
            padding: 18px 42px;
            font-size: 0.98rem;
            font-family: var(--font-body);
            font-weight: 400;
            letter-spacing: 0.5px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition-lux);
            box-shadow: var(--shadow-glass);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            margin-top: 28px;
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.15), transparent);
            transition: 0.8s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-glow);
            border-color: var(--champagne-gold);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-continue {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            box-shadow: none;
            cursor: pointer;
            padding: 14px 28px;
            transition: var(--transition-lux);
            margin-top: 45px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .btn-continue:hover {
            color: var(--text-dark);
            transform: translateY(4px);
        }

        /* Scroll Animations */
        .reveal {
            opacity: 0;
            transform: translateY(35px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* ==========================================
           SECTION 1: OPENING SCREEN
           ========================================== */
        #opening {
            background: radial-gradient(circle at center, #FFFFFF 0%, var(--bg-warm-ivory) 100%);
        }

        #opening h1 {
            font-size: clamp(3rem, 7vw, 4.8rem);
            margin: 18px 0;
            font-family: var(--font-display);
        }

        #opening p.sub-heading {
            font-size: 1.35rem;
            color: var(--rose-muted);
            margin-bottom: 28px;
            font-weight: 300;
            font-family: var(--font-heading);
            font-style: italic;
        }

        /* ==========================================
           SECTION 2: BIRTHDAY REVEAL
           ========================================== */
        #reveal-section h1 {
            font-size: clamp(2.8rem, 6vw, 4.2rem);
            margin-bottom: 18px;
            font-family: var(--font-display);
        }

        .sunflower-container {
            position: relative;
            display: inline-block;
            margin: 25px 0;
        }

        .sunflower-icon {
            font-size: 3rem;
            display: inline-block;
            filter: drop-shadow(0 10px 15px rgba(212, 175, 55, 0.3));
            animation: floatLux 5s ease-in-out infinite;
        }

        @keyframes floatLux {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(4deg); }
        }

        /* ==========================================
           SECTION 3: REFLECTIONS (CARDS)
           ========================================== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 28px;
            margin-top: 35px;
        }

        .card {
            background: var(--bg-paper);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--champagne-gold-border);
            padding: 40px 30px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
            text-align: left;
            transition: var(--transition-lux);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--champagne-gold), transparent);
            opacity: 0;
            transition: var(--transition-lux);
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(212, 175, 55, 0.6);
            box-shadow: var(--shadow-soft);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--baby-pink), var(--blush-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            color: var(--rose-muted);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
        }

        .card h3 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            font-family: var(--font-heading);
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.98rem;
            line-height: 1.7;
        }

        /* ==========================================
           SECTION 4: OUR STORY TIMELINE
           ========================================== */
        .timeline {
            position: relative;
            max-width: 680px;
            margin: 50px auto 0;
            padding-left: 35px;
            text-align: left;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 10px;
            bottom: 10px;
            left: 7px;
            width: 2px;
            background: linear-gradient(180deg, transparent, var(--champagne-gold) 15%, var(--champagne-gold) 85%, transparent);
            opacity: 0.6;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 45px;
            padding-left: 24px;
        }

        .timeline-dot {
            position: absolute;
            left: -33px;
            top: 6px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--bg-warm-ivory);
            border: 2px solid var(--champagne-gold);
            box-shadow: 0 0 12px var(--champagne-gold);
            transition: var(--transition-lux);
        }

        .timeline-item:hover .timeline-dot {
            background: var(--champagne-gold);
            transform: scale(1.2);
        }

        .timeline-title {
            font-size: 0.8rem;
            letter-spacing: 2.5px;
            color: var(--rose-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .timeline-text {
            color: var(--text-dark);
            font-size: 1.05rem;
            line-height: 1.75;
            font-weight: 300;
        }

        /* ==========================================
           SECTION 5: NOSTALGIA GRID
           ========================================== */
        .remember-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 35px;
        }

        .remember-card {
            background: var(--bg-paper);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(247, 214, 216, 0.7);
            padding: 28px 24px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            color: var(--text-dark);
            transition: var(--transition-lux);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            box-shadow: var(--shadow-card);
        }

        .remember-card:hover {
            background: var(--baby-pink);
            transform: translateY(-4px) scale(1.01);
            border-color: var(--blush-pink);
            box-shadow: var(--shadow-soft);
        }

        /* ==========================================
           SECTION 6: MUSIC PLAYER
           ========================================== */
        .player-card {
            background: var(--bg-paper);
            backdrop-filter: blur(16px);
            border: 1px solid var(--champagne-gold-border);
            padding: 45px 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            max-width: 440px;
            margin: 35px auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .vinyl-container {
            width: 200px;
            height: 200px;
            position: relative;
            margin-bottom: 30px;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #2C2825 22%, #181615 23%, #181615 38%, #2C2825 39%, #181615 65%, #2C2825 66%);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 14s linear infinite;
            animation-play-state: paused;
            position: relative;
        }

        .vinyl::after {
            content: '';
            position: absolute;
            width: 90%; height: 90%;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        .tonearm {
            position: absolute;
            top: -10px;
            right: 10px;
            width: 60px;
            height: 90px;
            pointer-events: none;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: top right;
            transform: rotate(-25deg);
            z-index: 5;
        }

        .tonearm-line {
            width: 4px;
            height: 70px;
            background: linear-gradient(to bottom, #d4af37, #8c7a6b);
            position: absolute;
            right: 20px;
            top: 10px;
            border-radius: 2px;
        }

        .tonearm.playing {
            transform: rotate(0deg);
        }

        .vinyl-center {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blush-pink), var(--baby-pink));
            border: 2px solid var(--champagne-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: var(--text-dark);
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 2;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .player-status {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 22px;
            font-weight: 300;
        }

        .btn-play {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--text-dark);
            color: var(--bg-warm-ivory);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-lux);
            box-shadow: var(--shadow-soft);
        }

        .btn-play:hover {
            transform: scale(1.1);
            background: var(--rose-muted);
            box-shadow: var(--shadow-glow);
        }

        /* ==========================================
           SECTION 7: WISHES SEQUENCER
           ========================================== */
        .wishes-container {
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 35px 0;
            position: relative;
        }

        .wish-item {
            font-family: var(--font-heading);
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            color: var(--text-dark);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.9s ease, transform 0.9s ease;
            position: absolute;
            max-width: 650px;
            padding: 0 20px;
            font-style: italic;
        }

        .wish-item.active {
            opacity: 1;
            transform: translateY(0);
        }

        .wish-final {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--rose-muted);
            margin-top: 25px;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .wish-final.show {
            opacity: 1;
        }

        /* ==========================================
           SECTION 8: ENVELOPE ANIMATION & LETTER
           ========================================== */
        #letter-section {
            min-height: 100vh;
            padding: 60px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .envelope-wrapper {
            position: relative;
            width: 340px;
            height: 230px;
            background: var(--blush-pink);
            border-radius: 12px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            margin: 40px auto;
        }

        .envelope-wrapper:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-soft);
        }

        .envelope-flap {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-top: 125px solid #ECA8AC;
            transform-origin: top;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }

        .envelope-pocket {
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 0;
            border-left: 170px solid #F3C1C4;
            border-right: 170px solid #F3C1C4;
            border-bottom: 115px solid #EEB2B5;
            border-radius: 0 0 12px 12px;
            z-index: 3;
        }

        .envelope-seal {
            position: absolute;
            top: 105px; left: 50%;
            transform: translate(-50%, -50%);
            width: 48px; height: 48px;
